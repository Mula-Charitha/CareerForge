# Server Configuration
server.port=8080

# Application Name
spring.application.name=CareerForge-Backend

# MySQL Database Configuration
# Environment variables DB_URL, DB_USERNAME, DB_PASSWORD are used if set; otherwise defaults are used.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerforge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:au@123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration (5MB Limit)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Resume Storage Directory Configuration
careerforge.resume.storage-dir=${RESUME_STORAGE_DIR:uploads/resumes}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
